<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagay!</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
    <nav class="site-nav">
        <div class="nav-wrapper">
            <a href="#" class="brand-logo">Bagay!</a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Profile</a></li>
            </ul>
        </div>
    </nav>

    <main class="page-shell">
        <aside id="profile-left" class="profile-column" aria-label="Left profile panel"></aside>

        <section class="map-panel">
            <div class="map-panel__header">
                <h1 class="map-panel__title">Campus Match Map</h1>
                <p class="map-panel__copy">Select a highlighted room to explore shared spaces and profile matches.</p>
            </div>

            <div class="map-container">
                <div class="map-wrapper">
                    <img src="assets/images/map.png" alt="Campus map" class="map-image">
                    <svg class="hitbox-overlay" viewBox="0 0 1000 1200" preserveAspectRatio="none" aria-label="Interactive room map">
                        <g id="hitbox-group" transform="translate(45, 55) scale(1.0, 1.0)"></g>
                    </svg>
                </div>
            </div>
        </section>

        <aside id="profile-right" class="profile-column" aria-label="Right profile panel"></aside>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
